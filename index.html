<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>500px 视觉盛典北京站邀请函</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f7d07a;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 207, 81, 0.38), rgba(255, 207, 81, 0) 20%),
        radial-gradient(circle at 85% 8%, rgba(255, 222, 150, 0.26), rgba(255, 222, 150, 0) 18%),
        radial-gradient(circle at 15% 18%, rgba(255, 191, 90, 0.16), rgba(255, 191, 90, 0) 20%),
        linear-gradient(145deg, #5f2200 0%, #8a3207 18%, #b6490a 40%, #8d1807 68%, #280403 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background:
        linear-gradient(112deg, rgba(255, 231, 174, 0) 12%, rgba(255, 231, 174, 0.13) 20%, rgba(255, 231, 174, 0) 28%),
        linear-gradient(106deg, rgba(255, 208, 97, 0) 32%, rgba(255, 208, 97, 0.10) 40%, rgba(255, 208, 97, 0) 48%),
        linear-gradient(100deg, rgba(255, 240, 197, 0) 58%, rgba(255, 240, 197, 0.12) 64%, rgba(255, 240, 197, 0) 70%);
      opacity: 0.9;
    }
    body::after {
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 22%, rgba(0,0,0,0.12) 100%);
    }
    .page {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .card {
      background: linear-gradient(180deg, rgba(73, 13, 4, 0.76) 0%, rgba(44, 7, 3, 0.88) 100%);
      border: 1px solid rgba(255, 211, 120, 0.22);
      border-radius: 22px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 22px 50px rgba(0,0,0,0.28);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.3;
      color: #ffe29f;
      text-align: left;
      letter-spacing: 0.5px;
    }
    .event-meta {
      margin: 0 0 10px;
      color: #f2bd57;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .desc {
      margin: 0 0 20px;
      color: rgba(255, 236, 202, 0.92);
      font-size: 14px;
      line-height: 1.75;
      text-align: left;
    }
    .form-item { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #ffe5b0;
    }
    input[type="text"], input[type="tel"], input[type="file"] {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid rgba(247, 208, 122, 0.3);
      background: rgba(255,255,255,0.10);
      color: #fff4d8;
      font-size: 16px;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.45); }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px 16px;
      background: linear-gradient(180deg, #ffe09a, #f2ba4f);
      color: #5b2000;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .tips {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.7;
      color: rgba(255, 232, 190, 0.72);
    }
    .status {
      min-height: 24px;
      margin: 14px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #ffd27d;
    }
    .status.error { color: #ff9b8e; }
    .status.success { color: #ffe3a6; }
    .signup-prompt {
      display: none;
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 211, 120, 0.08);
      border: 1px solid rgba(247, 208, 122, 0.22);
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 232, 190, 0.88);
    }
    .signup-prompt.show { display: block; }
    .signup-prompt a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe09a, #f2ba4f);
      color: #5b2000;
      font-weight: 700;
      text-decoration: none;
    }
    .result {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(180deg, #2d0804 0%, #4b1107 55%, #260604 100%);
      overflow: hidden;
    }
    .result.show { display: block; }
    .result-panel {
      position: relative;
      width: 100%;
      height: 100%;
      padding: max(14px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
    }
    .result-title {
      flex: 0 0 auto;
      margin: 0 54px 10px 0;
      color: #ffe29f;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
    }
    .result-close {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 10001;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 225, 168, 0.24);
      border-radius: 50%;
      background: rgba(26, 4, 2, 0.58);
      color: #ffe3a6;
      font-size: 24px;
      line-height: 34px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .preview-wrap {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
    }
    .preview-wrap img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      -webkit-touch-callout: default;
      user-select: auto;
    }
    body.modal-open { overflow: hidden; }
    @media (max-width: 640px) {
      .result-panel {
        padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
      }
      .result-title { display: none; }
      .save-tip {
        margin: 7px 0 5px;
        font-size: 12px;
        line-height: 1.4;
      }
      .actions {
        flex-wrap: nowrap;
        margin-top: 5px;
        gap: 8px;
      }
      .ghost-btn, .download-link {
        min-width: 0;
        padding: 10px 8px;
        font-size: 14px;
      }
    }
    .save-tip {
        flex: 0 0 auto;
        margin: 8px 0 6px;
        font-size: 12px;
        line-height: 1.45;
      }
      .actions {
        flex: 0 0 auto;
        flex-wrap: nowrap;
        margin-top: 6px;
        gap: 8px;
      }
      .ghost-btn, .download-link {
        min-width: 0;
        padding: 11px 10px;
        font-size: 14px;
      }
    }
    .save-tip {
      margin: 10px 0 0;
      text-align: center;
      color: rgba(255, 232, 190, 0.8);
      font-size: 14px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .ghost-btn, .download-link {
      flex: 1;
      min-width: 140px;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
    }
    .ghost-btn {
      border: 1px solid rgba(247,208,122,0.35);
      background: transparent;
      color: #ffd27d;
      cursor: pointer;
    }
    .download-link {
      background: rgba(255, 211, 120, 0.12);
      color: #ffd27d;
      border: 1px solid rgba(247,208,122,0.24);
    }
    .hidden-canvas { position: fixed; left: -99999px; top: -99999px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>领取你的500px专属邀请函</h1>
      <div class="event-meta">2026视觉中国500px视觉盛典·北京站｜09/06 · 中华世纪坛剧场</div>
      <p class="desc">
        欢迎参加视觉盛典北京站。已报名用户输入 <strong>500px 用户名</strong>、<strong>手机号后 4 位</strong>并上传头像，即可生成专属邀请函。
      </p>

      <div class="form-item">
        <label for="username">500px 用户名</label>
        <input id="username" type="text" placeholder="请输入500px用户名" />
      </div>

      <div class="form-item">
        <label for="phoneLast4">手机号后 4 位</label>
        <input id="phoneLast4" type="tel" maxlength="5" inputmode="numeric" placeholder="例如 1234" />
      </div>

      <div class="form-item">
        <label for="avatarFile">上传个人头像</label>
        <input id="avatarFile" type="file" accept="image/*" />
      </div>

      <button id="generateBtn" class="btn">生成邀请函</button>
      <div id="status" class="status"></div>

      <div id="signupPrompt" class="signup-prompt">
        暂未匹配到报名信息，请检查用户名和手机号后 4 位是否填写正确。<br>
        如已提交报名问卷，请于24小时后再尝试。<br>
        如尚未报名，可点击下方查看活动详情并报名。
        <br>
        <a href="https://mp.weixin.qq.com/s/hFhNOr4633dhehBHwqkVNg" target="_blank" rel="noopener noreferrer">查看活动详情并报名</a>
      </div>

    </div>
  </div>

  <div id="result" class="result" aria-hidden="true">
    <div class="result-panel">
      <button id="resultCloseBtn" class="result-close" type="button" aria-label="关闭">×</button>
      <div class="result-title">你的专属邀请函已生成</div>
      <div class="preview-wrap">
        <img id="resultImage" alt="邀请函预览" />
      </div>
      <p class="save-tip">手机端长按图片保存，电脑端可直接下载。</p>
      <div class="actions">
        <button id="regenerateBtn" class="ghost-btn" type="button">返回修改</button>
        <a id="downloadLink" class="download-link" href="#" download>下载邀请函</a>
      </div>
    </div>
  </div>

  <canvas id="posterCanvas" class="hidden-canvas" width="5175" height="9200"></canvas>

  <script src="./data.js"></script>
  <script>
    const OUTPUT_WIDTH = 5175;
    const OUTPUT_HEIGHT = 9200;
    const TEMPLATE_SRC = './参会用户邀请函-模版.png';

    // 基于模板图（1152x2048）估算出来的位置
    const BASE_TEMPLATE_WIDTH = 1152;
    const BASE_TEMPLATE_HEIGHT = 2048;
    const SCALE_X = OUTPUT_WIDTH / BASE_TEMPLATE_WIDTH;
    const SCALE_Y = OUTPUT_HEIGHT / BASE_TEMPLATE_HEIGHT;

    const AVATAR = {
      x: 576 * SCALE_X,
      y: 582 * SCALE_Y,
      r: 111 * SCALE_X
    };

    const USERNAME = {
      x: OUTPUT_WIDTH / 2,
      y: 805 * SCALE_Y,
      maxWidth: 2500,
      fontSize: 245,
      minFontSize: 120,
      color: '#f4c25f'
    };

    const usernameInput = document.getElementById('username');
    const phoneLast4Input = document.getElementById('phoneLast4');
    const avatarInput = document.getElementById('avatarFile');
    const generateBtn = document.getElementById('generateBtn');
    const regenerateBtn = document.getElementById('regenerateBtn');
    const resultCloseBtn = document.getElementById('resultCloseBtn');
    const statusEl = document.getElementById('status');
    const signupPrompt = document.getElementById('signupPrompt');
    const resultWrap = document.getElementById('result');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const STAFF_CODE = '58888';

    phoneLast4Input.addEventListener('input', () => {
      phoneLast4Input.value = phoneLast4Input.value.replace(/\D/g, '').slice(0, 5);
    });

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function openResultModal() {
      resultWrap.classList.add('show');
      resultWrap.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeResultModal() {
      resultWrap.classList.remove('show');
      resultWrap.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    function normalizeName(value) {
      return (value || '')
        .toString()
        .trim()
        .toLowerCase()
        .replace(/[\s\u3000]+/g, '');
    }

    function scoreMatch(inputName, recordName) {
      const input = normalizeName(inputName);
      const record = normalizeName(recordName);
      if (!input || !record) return -1;
      if (input === record) return 100;
      if (record.startsWith(input) || input.startsWith(record)) return 80;
      if (record.includes(input) || input.includes(record)) return 60;
      return -1;
    }

    function findMatchedUser(name, last4) {
      const list = Array.isArray(window.SIGNUP_DATA) ? window.SIGNUP_DATA : [];
      const candidates = list
        .filter(item => item.phoneLast4 === last4)
        .map(item => ({ ...item, score: scoreMatch(name, item.username) }))
        .filter(item => item.score >= 0)
        .sort((a, b) => b.score - a.score || a.username.length - b.username.length);
      return candidates[0] || null;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('图片加载失败：' + src));
        img.src = src;
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('头像读取失败'));
        reader.readAsDataURL(file);
      });
    }

    function drawAvatar(img) {
      const diameter = AVATAR.r * 2;
      const padding = AVATAR.r * 0.04;
      const drawDiameter = diameter - padding * 2;

      const sw = img.naturalWidth || img.width;
      const sh = img.naturalHeight || img.height;
      const size = Math.min(sw, sh);
      const sx = (sw - size) / 2;
      const sy = (sh - size) / 2;

      ctx.save();
      ctx.beginPath();
      ctx.arc(AVATAR.x, AVATAR.y, AVATAR.r - padding, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(
        img,
        sx,
        sy,
        size,
        size,
        AVATAR.x - drawDiameter / 2,
        AVATAR.y - drawDiameter / 2,
        drawDiameter,
        drawDiameter
      );
      ctx.restore();
    }

    function drawUsername(name) {
      let fontSize = USERNAME.fontSize;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = USERNAME.color;
      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;

      while (fontSize >= USERNAME.minFontSize) {
        ctx.font = `700 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
        if (ctx.measureText(name).width <= USERNAME.maxWidth) break;
        fontSize -= 8;
      }

      ctx.fillText(name, USERNAME.x, USERNAME.y);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }

    async function generatePoster() {
      const inputName = usernameInput.value.trim();
      const phoneLast4 = phoneLast4Input.value.trim();
      const avatarFile = avatarInput.files && avatarInput.files[0];

      signupPrompt.classList.remove('show');

      if (!inputName) {
        setStatus('请输入 500px 用户名。', 'error');
        return;
      }
      const isStaffMode = phoneLast4 === STAFF_CODE;

      if (!isStaffMode && !/^\d{4}$/.test(phoneLast4)) {
        setStatus('请输入正确的手机号后 4 位。', 'error');
        return;
      }
      if (!avatarFile) {
        setStatus('请先上传个人头像。', 'error');
        return;
      }

      // 普通用户：手机号后4位 + 用户名半匹配；工作人员：输入专用代码后可直接自定义用户名
      const matched = isStaffMode
        ? { username: inputName }
        : findMatchedUser(inputName, phoneLast4);

      if (!matched) {
        setStatus('暂未匹配到报名信息。', 'error');
        signupPrompt.classList.add('show');
        closeResultModal();
        return;
      }

      try {
        generateBtn.disabled = true;
        setStatus('正在生成邀请函，请稍候…', 'success');

        const [templateImg, avatarImg] = await Promise.all([
          loadImage(TEMPLATE_SRC),
          readFileAsDataURL(avatarFile).then(loadImage)
        ]);

        ctx.clearRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
        drawAvatar(avatarImg); // 最下层：头像
        ctx.drawImage(templateImg, 0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT); // 中间层：模版
        drawUsername(matched.username); // 最上层：用户名

        const dataUrl = canvas.toDataURL('image/png');
        resultImage.src = dataUrl;
        openResultModal();
        downloadLink.href = dataUrl;
        downloadLink.download = `500px北京站邀请函_${matched.username}.png`;
        signupPrompt.classList.remove('show');
        setStatus(`邀请函已生成：${matched.username}`, 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || '生成失败，请稍后重试。', 'error');
        closeResultModal();
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generatePoster);
    regenerateBtn.addEventListener('click', closeResultModal);
    resultCloseBtn.addEventListener('click', closeResultModal);
    resultWrap.addEventListener('click', (event) => {
      if (event.target === resultWrap) closeResultModal();
    });
  </script>
</body>
</html>
