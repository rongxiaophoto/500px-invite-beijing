<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>500px 视觉盛典北京站邀请函</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f7d07a;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 207, 81, 0.38), rgba(255, 207, 81, 0) 20%),
        radial-gradient(circle at 85% 8%, rgba(255, 222, 150, 0.26), rgba(255, 222, 150, 0) 18%),
        radial-gradient(circle at 15% 18%, rgba(255, 191, 90, 0.16), rgba(255, 191, 90, 0) 20%),
        linear-gradient(145deg, #5f2200 0%, #8a3207 18%, #b6490a 40%, #8d1807 68%, #280403 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background:
        linear-gradient(112deg, rgba(255, 231, 174, 0) 12%, rgba(255, 231, 174, 0.13) 20%, rgba(255, 231, 174, 0) 28%),
        linear-gradient(106deg, rgba(255, 208, 97, 0) 32%, rgba(255, 208, 97, 0.10) 40%, rgba(255, 208, 97, 0) 48%),
        linear-gradient(100deg, rgba(255, 240, 197, 0) 58%, rgba(255, 240, 197, 0.12) 64%, rgba(255, 240, 197, 0) 70%);
      opacity: 0.9;
    }
    body::after {
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 22%, rgba(0,0,0,0.12) 100%);
    }
    .page {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .card {
      background: linear-gradient(180deg, rgba(73, 13, 4, 0.76) 0%, rgba(44, 7, 3, 0.88) 100%);
      border: 1px solid rgba(255, 211, 120, 0.22);
      border-radius: 22px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 22px 50px rgba(0,0,0,0.28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
      color: #ffe29f;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .desc {
      margin: 0 0 18px;
      color: rgba(255, 236, 202, 0.92);
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
    }
    .form-item { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #ffe5b0;
    }
    input[type="text"], input[type="tel"], input[type="file"] {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid rgba(247, 208, 122, 0.3);
      background: rgba(255,255,255,0.10);
      color: #fff4d8;
      font-size: 16px;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.45); }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px 16px;
      background: linear-gradient(180deg, #ffe09a, #f2ba4f);
      color: #5b2000;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .tips {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.7;
      color: rgba(255, 232, 190, 0.72);
    }
    .status {
      min-height: 24px;
      margin: 14px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #ffd27d;
    }
    .status.error { color: #ff9b8e; }
    .status.success { color: #ffe3a6; }
    .signup-prompt {
      display: none;
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 211, 120, 0.08);
      border: 1px solid rgba(247, 208, 122, 0.22);
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 232, 190, 0.88);
    }
    .signup-prompt.show { display: block; }
    .signup-prompt a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe09a, #f2ba4f);
      color: #5b2000;
      font-weight: 700;
      text-decoration: none;
    }
    .result {
      display: none;
      margin-top: 20px;
    }
    .result.show { display: block; }
    .preview-wrap {
      margin-top: 14px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(247,208,122,0.18);
    }
    .preview-wrap img {
      display: block;
      width: 100%;
      height: auto;
      background: #1b0703;
    }
    .save-tip {
      margin: 10px 0 0;
      text-align: center;
      color: rgba(255, 232, 190, 0.8);
      font-size: 14px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .ghost-btn, .download-link {
      flex: 1;
      min-width: 140px;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
    }
    .ghost-btn {
      border: 1px solid rgba(247,208,122,0.35);
      background: transparent;
      color: #ffd27d;
      cursor: pointer;
    }
    .download-link {
      background: rgba(255, 211, 120, 0.12);
      color: #ffd27d;
      border: 1px solid rgba(247,208,122,0.24);
    }
    .hidden-canvas { position: fixed; left: -99999px; top: -99999px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>500px 视觉盛典北京站邀请函</h1>
      <p class="desc">
        欢迎参加 <strong>2026视觉中国500px视觉盛典·北京站</strong>。9月6日，我们将在中华世纪坛剧场与摄影师、影像创作者和热爱摄影的朋友相聚，一起分享创作、交流影像，感受属于摄影人的年度相聚。
        <br><br>
        <strong>如果你已经报名北京站，欢迎来领取属于你的专属邀请函。</strong><br>
        输入 <strong>500px 用户名</strong>、<strong>手机号后 4 位</strong>，并上传头像，即可生成个人邀请函。生成后可在手机上长按图片保存。
      </p>

      <div class="form-item">
        <label for="username">500px 用户名</label>
        <input id="username" type="text" placeholder="请输入报名时填写的 500px 用户名" />
      </div>

      <div class="form-item">
        <label for="phoneLast4">手机号后 4 位</label>
        <input id="phoneLast4" type="tel" maxlength="4" inputmode="numeric" placeholder="例如 3193" />
      </div>

      <div class="form-item">
        <label for="avatarFile">上传个人头像</label>
        <input id="avatarFile" type="file" accept="image/*" />
      </div>

      <button id="generateBtn" class="btn">生成邀请函</button>
      <div id="status" class="status"></div>

      <div id="signupPrompt" class="signup-prompt">
        暂未匹配到报名信息，请检查用户名和手机号后 4 位是否填写正确。<br>
        如尚未报名，可点击下方查看活动详情并报名。
        <br>
        <a href="https://mp.weixin.qq.com/s/hFhNOr4633dhehBHwqkVNg" target="_blank" rel="noopener noreferrer">查看活动详情并报名</a>
      </div>

      <div id="result" class="result">
        <div class="preview-wrap">
          <img id="resultImage" alt="邀请函预览" />
        </div>
        <p class="save-tip">手机端可长按上方图片保存；电脑端可点击下方按钮下载。</p>
        <div class="actions">
          <button id="regenerateBtn" class="ghost-btn" type="button">重新生成</button>
          <a id="downloadLink" class="download-link" href="#" download>下载邀请函</a>
        </div>
      </div>
    </div>
  </div>

  <canvas id="posterCanvas" class="hidden-canvas" width="5175" height="9200"></canvas>

  <script src="./data.js"></script>
  <script>
    const OUTPUT_WIDTH = 5175;
    const OUTPUT_HEIGHT = 9200;
    const TEMPLATE_SRC = './参会用户邀请函-模版.png';

    // 基于模板图（1152x2048）估算出来的位置
    const BASE_TEMPLATE_WIDTH = 1152;
    const BASE_TEMPLATE_HEIGHT = 2048;
    const SCALE_X = OUTPUT_WIDTH / BASE_TEMPLATE_WIDTH;
    const SCALE_Y = OUTPUT_HEIGHT / BASE_TEMPLATE_HEIGHT;

    const AVATAR = {
      x: 576 * SCALE_X,
      y: 582 * SCALE_Y,
      r: 111 * SCALE_X
    };

    const USERNAME = {
      x: OUTPUT_WIDTH / 2,
      y: 805 * SCALE_Y,
      maxWidth: 2500,
      fontSize: 245,
      minFontSize: 120,
      color: '#f4c25f'
    };

    const usernameInput = document.getElementById('username');
    const phoneLast4Input = document.getElementById('phoneLast4');
    const avatarInput = document.getElementById('avatarFile');
    const generateBtn = document.getElementById('generateBtn');
    const regenerateBtn = document.getElementById('regenerateBtn');
    const statusEl = document.getElementById('status');
    const signupPrompt = document.getElementById('signupPrompt');
    const resultWrap = document.getElementById('result');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    phoneLast4Input.addEventListener('input', () => {
      phoneLast4Input.value = phoneLast4Input.value.replace(/\D/g, '').slice(0, 4);
    });

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function normalizeName(value) {
      return (value || '')
        .toString()
        .trim()
        .toLowerCase()
        .replace(/[\s\u3000]+/g, '');
    }

    function scoreMatch(inputName, recordName) {
      const input = normalizeName(inputName);
      const record = normalizeName(recordName);
      if (!input || !record) return -1;
      if (input === record) return 100;
      if (record.startsWith(input) || input.startsWith(record)) return 80;
      if (record.includes(input) || input.includes(record)) return 60;
      return -1;
    }

    function findMatchedUser(name, last4) {
      const list = Array.isArray(window.SIGNUP_DATA) ? window.SIGNUP_DATA : [];
      const candidates = list
        .filter(item => item.phoneLast4 === last4)
        .map(item => ({ ...item, score: scoreMatch(name, item.username) }))
        .filter(item => item.score >= 0)
        .sort((a, b) => b.score - a.score || a.username.length - b.username.length);
      return candidates[0] || null;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('图片加载失败：' + src));
        img.src = src;
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('头像读取失败'));
        reader.readAsDataURL(file);
      });
    }

    function drawAvatar(img) {
      const diameter = AVATAR.r * 2;
      const padding = AVATAR.r * 0.04;
      const drawDiameter = diameter - padding * 2;

      const sw = img.naturalWidth || img.width;
      const sh = img.naturalHeight || img.height;
      const size = Math.min(sw, sh);
      const sx = (sw - size) / 2;
      const sy = (sh - size) / 2;

      ctx.save();
      ctx.beginPath();
      ctx.arc(AVATAR.x, AVATAR.y, AVATAR.r - padding, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(
        img,
        sx,
        sy,
        size,
        size,
        AVATAR.x - drawDiameter / 2,
        AVATAR.y - drawDiameter / 2,
        drawDiameter,
        drawDiameter
      );
      ctx.restore();
    }

    function drawUsername(name) {
      let fontSize = USERNAME.fontSize;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = USERNAME.color;
      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;

      while (fontSize >= USERNAME.minFontSize) {
        ctx.font = `700 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
        if (ctx.measureText(name).width <= USERNAME.maxWidth) break;
        fontSize -= 8;
      }

      ctx.fillText(name, USERNAME.x, USERNAME.y);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }

    async function generatePoster() {
      const inputName = usernameInput.value.trim();
      const phoneLast4 = phoneLast4Input.value.trim();
      const avatarFile = avatarInput.files && avatarInput.files[0];

      signupPrompt.classList.remove('show');

      if (!inputName) {
        setStatus('请输入 500px 用户名。', 'error');
        return;
      }
      if (!/^\d{4}$/.test(phoneLast4)) {
        setStatus('请输入正确的手机号后 4 位。', 'error');
        return;
      }
      if (!avatarFile) {
        setStatus('请先上传个人头像。', 'error');
        return;
      }

      const matched = findMatchedUser(inputName, phoneLast4);
      if (!matched) {
        setStatus('暂未匹配到报名信息。', 'error');
        signupPrompt.classList.add('show');
        resultWrap.classList.remove('show');
        return;
      }

      try {
        generateBtn.disabled = true;
        setStatus('正在生成邀请函，请稍候…', 'success');

        const [templateImg, avatarImg] = await Promise.all([
          loadImage(TEMPLATE_SRC),
          readFileAsDataURL(avatarFile).then(loadImage)
        ]);

        ctx.clearRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
        drawAvatar(avatarImg); // 最下层：头像
        ctx.drawImage(templateImg, 0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT); // 中间层：模版
        drawUsername(matched.username); // 最上层：用户名

        const dataUrl = canvas.toDataURL('image/png');
        resultImage.src = dataUrl;
        resultWrap.classList.add('show');
        downloadLink.href = dataUrl;
        downloadLink.download = `500px北京站邀请函_${matched.username}.png`;
        signupPrompt.classList.remove('show');
        setStatus(`匹配成功：${matched.username}。邀请函已生成。`, 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || '生成失败，请稍后重试。', 'error');
        resultWrap.classList.remove('show');
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generatePoster);
    regenerateBtn.addEventListener('click', generatePoster);
  </script>
</body>
</html>
